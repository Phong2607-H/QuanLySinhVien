<div class="auth-container">
  <div class="auth-box">
    <h2>ĐĂNG KÝ TÀI KHOẢN</h2>

    <div *ngIf="errorMessage" class="error-banner">
      ⚠️ {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="success-banner">
      ✅ {{ successMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="fullName">Họ và tên</label>
        <input type="text"
               id="fullName"
               name="fullName"
               [(ngModel)]="user.fullName"
               required
               #fullNameVar="ngModel"
               placeholder="Nhập họ và tên">
        <div *ngIf="fullNameVar.invalid && (fullNameVar.dirty || fullNameVar.touched)" class="validation-error">
          ⚠️ Họ và tên không được để trống!
        </div>
      </div>

      <div class="form-group">
        <label for="username">Tên đăng nhập</label>
        <input type="text"
               id="username"
               name="username"
               [(ngModel)]="user.username"
               required
               minlength="3"
               #usernameVar="ngModel"
               placeholder="Nhập tên đăng nhập">
        <div *ngIf="usernameVar.invalid && (usernameVar.dirty || usernameVar.touched)" class="validation-error">
          <span *ngIf="usernameVar.errors?.['required']">⚠️ Tên đăng nhập không được để trống!</span>
          <span *ngIf="usernameVar.errors?.['minlength']">⚠️ Tên đăng nhập phải có ít nhất 3 ký tự!</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password"
               id="password"
               name="password"
               [(ngModel)]="user.password"
               required
               minlength="6"
               #passwordVar="ngModel"
               placeholder="Nhập mật khẩu">
        <div *ngIf="passwordVar.invalid && (passwordVar.dirty || passwordVar.touched)" class="validation-error">
          <span *ngIf="passwordVar.errors?.['required']">⚠️ Mật khẩu không được để trống!</span>
          <span *ngIf="passwordVar.errors?.['minlength']">⚠️ Mật khẩu phải có ít nhất 6 ký tự!</span>
        </div>
      </div>

      <button type="submit"
              class="btn-primary"
              [disabled]="fullNameVar.invalid || usernameVar.invalid || passwordVar.invalid">
        Đăng ký
      </button>
    </form>

    <div class="auth-footer">
      <span>Đã có tài khoản? </span>
      <a (click)="goToLogin()">Đăng nhập ngay</a>
    </div>
  </div>
</div>
